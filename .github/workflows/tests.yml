name: tests

# Fast, dependency-light CI: every jwst_tool module imports with numpy alone
# (the pandeia and JAX/VULCAN-JAX/ExoJAX imports are function-local); jax and
# the two sibling packages, without exojax, are installed for the tests that
# reach the engine. It exercises the count-space binning operator, the
# noise/floor math, detection + Fisher nuisance projection and the
# forward-param gating. The JWST_TOOL_RUN_SLOW=1 tier (real forward runs) and
# the pandeia/PandExo parity harness need the full stack and are NOT run here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # requires-python = ">=3.10", the sibling packages' floor (their NAS
        # env runs 3.10). Keep all three tested so the floor claim stays
        # verified.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal deps (no pandeia / ExoJAX stack)
        # --no-deps throughout: the siblings are not on PyPI, so a plain
        # editable install would try (and fail) to resolve them there, and
        # exojax and the rest of their trees are not needed here.
        #
        # The unit suite reaches both siblings: conftest imports
        # vulcan_forward.vulcan_chem (jax, for the import order), the
        # engine-contract tests import vulcan_forward modules and
        # vulcan3.atm_setup, and the T-P table helpers locate vulcan3's
        # bundled atm/*.txt with importlib.find_spec. Tests that need exojax
        # skip. Installed at the PINNED commits from deploy/pins.env -- the same
        # manifest the Space Dockerfile enforces (tests/unit/test_deploy_pins
        # keeps the two in lock-step), so CI validates the sibling code that
        # actually deploys, not whatever main points to at run time.
        run: |
          pip install "jax>=0.6" numpy scipy matplotlib pytest pyyaml
          source deploy/pins.env
          pip install --no-deps "vulcan3 @ git+https://github.com/imalsky/VULCAN3.git@${VULCAN3_SHA}"
          pip install --no-deps "vulcan-forward @ git+https://github.com/imalsky/vulcan-forward.git@${VULCAN_FORWARD_SHA}"
          pip install --no-deps -e .
      - name: Validate CITATION.cff against the CFF schema
        run: |
          pip install cffconvert
          cffconvert --validate
      - name: Run unit tests
        run: python -m pytest tests -q -ra

  # The unit lane installs no streamlit/pandas, so tests/unit/test_app_smoke.py
  # importorskips itself there -- the result page (the most frequently changed
  # code) would never execute in CI. This lane runs it for real on one
  # interpreter.
  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install GUI deps (streamlit + pandas on top of the unit set)
        run: |
          pip install "jax>=0.6" numpy scipy matplotlib pytest streamlit pandas pyarrow
          source deploy/pins.env
          pip install --no-deps "vulcan3 @ git+https://github.com/imalsky/VULCAN3.git@${VULCAN3_SHA}"
          pip install --no-deps "vulcan-forward @ git+https://github.com/imalsky/vulcan-forward.git@${VULCAN_FORWARD_SHA}"
          pip install --no-deps -e .
      - name: Run the Streamlit result-page smoke tests
        run: python -m pytest tests/unit/test_app_smoke.py -q -ra
