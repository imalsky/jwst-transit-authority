name: tests

# Fast, dependency-light CI: the whole unit suite is numpy-only (the pandeia and
# JAX/VULCAN-JAX/ExoJax imports are function-local, so every jwst_tool module
# imports with numpy alone), plus two LIGHT touchpoints on the sibling packages
# that the install step below supplies. It exercises the count-space binning operator, the
# noise/floor/covariance math, detection + Fisher nuisance projection, the
# scenario covariances, and the forward-param gating. The env-gated slow test
# (JWST_TOOL_RUN_SLOW=1: 3 real forward runs) and the pandeia/PandExo parity
# harness are NOT run here -- those need the full stack and run locally / on HPC.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # requires-python = ">=3.10"; 3.10 is the NAS deploy interpreter. Keep
        # all three tested so the floor claim stays verified.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal deps (no pandeia / ExoJAX stack)
        # --no-deps throughout: the siblings are not on PyPI, so a plain
        # editable install would try (and fail) to resolve them there, and
        # their own trees (exojax, the full JAX stack) are not needed here.
        #
        # The two siblings ARE needed, from GitHub, for two light touchpoints
        # the unit suite reaches (they were the 6 failures 2026-07-22..08-02):
        #   vulcan-jax     located with importlib.find_spec for its bundled
        #                  atm/*.txt T-P tables; the package is never executed
        #   vulcan-forward `from vulcan_forward import constants`, pure
        #                  constants, no jax/exojax imports
        # Installed at the PINNED commits from deploy/pins.env -- the same
        # manifest the Space Dockerfile enforces (tests/unit/test_deploy_pins
        # keeps the two in lock-step), so CI validates the sibling code that
        # actually deploys, not whatever main points to at run time.
        run: |
          pip install "jax>=0.6" numpy scipy matplotlib pytest
          source deploy/pins.env
          pip install --no-deps "vulcan-jax @ git+https://github.com/imalsky/jax-vulcan.git@${VULCAN_JAX_SHA}"
          pip install --no-deps "vulcan-forward @ git+https://github.com/imalsky/vulcan-forward.git@${VULCAN_FORWARD_SHA}"
          pip install --no-deps -e .
      - name: Validate CITATION.cff against the CFF schema
        run: |
          pip install cffconvert
          cffconvert --validate
      - name: Run unit tests
        run: python -m pytest tests -q -ra

  # The unit lane installs no streamlit/pandas, so tests/unit/test_app_smoke.py
  # importorskips itself there -- the result page (the most frequently changed
  # code) would never execute in CI. This lane runs it for real on one
  # interpreter.
  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install GUI deps (streamlit + pandas on top of the unit set)
        run: |
          pip install "jax>=0.6" numpy scipy matplotlib pytest streamlit pandas pyarrow
          source deploy/pins.env
          pip install --no-deps "vulcan-jax @ git+https://github.com/imalsky/jax-vulcan.git@${VULCAN_JAX_SHA}"
          pip install --no-deps "vulcan-forward @ git+https://github.com/imalsky/vulcan-forward.git@${VULCAN_FORWARD_SHA}"
          pip install --no-deps -e .
      - name: Run the Streamlit result-page smoke tests
        run: python -m pytest tests/unit/test_app_smoke.py tests/unit/test_share_config.py -q -ra
