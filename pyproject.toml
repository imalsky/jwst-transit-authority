# vulcan-jwst-tool: JWST instrument selector on the shared vulcan-forward
# engine. The Pandeia ETC noise backend runs in its OWN conda env, addressed via
# JWST_TOOL_PANDEIA_PYTHON -- it is deliberately NOT a dependency here. The
# ONLY backend is the STScI-supported matched triple pandeia.engine 2026.7 +
# pandeia_data-2026.7-jwst + pandeia_psfs-2026.7-jwst. Older backends were
# removed because this release does not ship or validate their complete
# matched data triples. Inputs live at the repo-root data/
# (override with JWST_TOOL_DATA_DIR); generated caches at output/
# (JWST_TOOL_OUTPUT_DIR).
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-jwst-tool"
dynamic = ["version"]
description = "JWST instrument selector: VULCAN-JAX chemistry -> ExoJAX transmission and emission spectra -> Pandeia ETC noise; conditional template S/N + Fisher forecasts (Streamlit GUI + programmatic API)"
readme = "README.md"
# 3.10 floor matches the sibling packages (vulcan-jax, vulcan-retrieval): the code
# is 3.10-clean and the deliberately-separate Pandeia env carries no constraint here.
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Malsky" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib",
    "jax>=0.6.2",
    # Emission converts the local PHOENIX grid into a stellar surface-flux
    # spectrum in jwst_tool.stellar.  These were present in the Space lock but
    # missing from the package metadata, so a clean local install failed only
    # when the first emission model reached the stellar-SED step.
    "synphot>=1.5",
    "stsynphot>=1.4",
    # Shared forward-model engine (this tool does not depend on the retrieval
    # application). The floor is load-bearing: an older engine ignores unknown
    # profile keys silently. tests/unit/test_engine_api_contract.py pins every
    # engine symbol and profile key the tool uses.
    "vulcan-forward>=0.12.1",
    # Direct imports: load_config (CO_BASELINE check) and steady_state_grad
    # (adjoint_diag). The floor carries the sflux-epseri normalization fix.
    "vulcan-jax>=0.3.1",
]

[project.urls]
Homepage = "https://github.com/imalsky/vulcan-jwst-tool"
Repository = "https://github.com/imalsky/vulcan-jwst-tool"

[project.optional-dependencies]
# streamlit floor: app.py uses the width="stretch" API on st.button/st.pyplot/
# st.dataframe, introduced for those widgets by 1.49.0 (2025-08-26).
gui = ["streamlit>=1.49", "pandas"]
# PICASO is not an install extra: PICASO 4.0.1 requires NumPy >=2 while
# ExoJAX 2.2.3 requires NumPy <2. The PICASO code path itself was removed
# in 0.43.0; canonical_params and share_config refuse its keys.
dev = ["ruff>=0.11", "build>=1.2", "twine>=5"]

[project.scripts]
jwst-tool = "jwst_tool.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the vendored house figure style app.py loads at startup + the per-release
# NASA Exoplanet Archive snapshot behind the custom-planet fill
jwst_tool = ["science.mplstyle", "exoplanet_archive_pscomppars.csv"]

[tool.setuptools.dynamic]
version = { attr = "jwst_tool._version.__version__" }

[tool.ruff]
line-length = 100
