# vulcan-jwst-tool: JWST instrument selector on the shared vulcan-forward
# engine. The Pandeia ETC noise backend runs in its OWN conda env, addressed via
# JWST_TOOL_PANDEIA_PYTHON -- it is deliberately NOT a dependency here. The
# DEFAULT backend is the STScI-supported matched triple pandeia.engine 2026.7 +
# pandeia_data-2026.7-jwst + pandeia_psfs-2026.7-jwst (JWST_TOOL_BACKEND=current,
# the default). Older backends were removed because this release does not ship
# or validate their complete matched data triples. Inputs live at the repo-root
# data/ (override with JWST_TOOL_DATA_DIR); generated caches at output/
# (JWST_TOOL_OUTPUT_DIR).
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-jwst-tool"
dynamic = ["version"]
description = "JWST instrument selector: VULCAN-JAX chemistry -> ExoJAX transmission and emission spectra -> Pandeia ETC noise; conditional template S/N + Fisher forecasts (Streamlit GUI + programmatic API)"
readme = "README.md"
# 3.10 floor matches the sibling packages (vulcan-jax, vulcan-retrieval): the code
# is 3.10-clean and the deliberately-separate Pandeia env carries no constraint here.
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Malsky" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib",
    "jax>=0.6.2",
    # The forward-model engine is a shared distribution since 2026-07-29,
    # so this tool no longer depends on the retrieval application at all
    # (they are siblings over one engine). 0.1.0 is the extraction
    # release, carrying the same physics as vulcan-retrieval 0.12.1:
    # the inverse-square g(r) in the shared transmission dtau that
    # forward v24 labels, the emission tau_bottom diagnostic, the Mie
    # condensate deck, and the profile-overridable RT knobs -- all
    # echo-verified by run_model.
    "vulcan-forward>=0.5.0",
    # 0.2.0 added the named ChemParams primitive this module builds its vector
    # with; 0.2.1 added paths.ensure_layout(), which `jwst-tool fetch` needs;
    # 0.2.2 adds CS2/C2H4/C2H6 to the molecule table (the v25 extras resolve
    # there); 0.4.0 anchors the planet radius at p_ref_bar instead of the RT
    # grid bottom; 0.5.0 adds emission_radius() and the interior source term.
    # An older engine ignores the new profile keys SILENTLY, so the floor is
    # what makes deploy/pins.env mean anything (test_engine_api_contract.py).
    "vulcan-jax>=0.3.1",  # direct imports: load_config (CO_BASELINE check) +
                          # steady_state_grad (adjoint_diag). 0.3.1 carries the
                          # sflux-epseri normalization fix the forward v22
                          # cache bust describes -- the floor must include it.
]

[project.urls]
Homepage = "https://github.com/imalsky/vulcan-jwst-tool"
Repository = "https://github.com/imalsky/vulcan-jwst-tool"

[project.optional-dependencies]
# streamlit floor: app.py uses the width="stretch" API on st.button/st.pyplot/
# st.dataframe, introduced for those widgets by 1.49.0 (2025-08-26).
gui = ["streamlit>=1.49", "pandas"]
# PICASO is deliberately not an install extra in this release: PICASO 4.0.1
# requires NumPy >=2 while ExoJAX 2.2.3 requires NumPy <2. The retained
# maintainer-only code path is disabled unless explicitly enabled and is not
# part of collaborator-certified results.
dev = ["ruff>=0.11", "build>=1.2", "twine>=5"]

[project.scripts]
jwst-tool = "jwst_tool.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the vendored house figure style app.py loads at startup + the per-release
# NASA Exoplanet Archive snapshot behind the custom-planet fill
jwst_tool = ["science.mplstyle", "exoplanet_archive_pscomppars.csv"]

[tool.setuptools.dynamic]
version = { attr = "jwst_tool._version.__version__" }

[tool.ruff]
line-length = 100
